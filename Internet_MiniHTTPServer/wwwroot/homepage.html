<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAUHAUS · 首页</title>
<style>
  :root{
    --black:#0a0a0a;
    --white:#f4f4f0;
    --line:#0a0a0a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--white);
    color:var(--black);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}

  /* 顶部导航 */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px 48px;
    border-bottom:3px solid var(--line);
  }
  .logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo .square{
    width:20px;height:20px;background:var(--black);
  }
  .logo .circle{
    width:20px;height:20px;border-radius:50%;border:3px solid var(--black);
  }
  .logo .triangle{
    width:0;height:0;border-left:11px solid transparent;
    border-right:11px solid transparent;border-bottom:20px solid var(--black);
  }
  nav{display:flex;gap:36px;}
  nav a{
    font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    position:relative;padding-bottom:4px;
  }
  nav a::after{
    content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--black);
    transition:width .25s ease;
  }
  nav a:hover::after{width:100%;}

  /* 主视觉 */
  .hero{
    flex:1;
    display:grid;
    grid-template-columns:1.3fr 1fr;
    position:relative;
    padding:0 48px;
  }
  .hero-left{
    padding:96px 0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    z-index:2;
  }
  .hero-tag{
    font-size:14px;font-weight:700;letter-spacing:6px;text-transform:uppercase;
    margin-bottom:28px;
    display:flex;align-items:center;gap:16px;
  }
  .hero-tag::before{
    content:"";width:48px;height:3px;background:var(--black);
  }
  h1{
    font-size:clamp(52px,9vw,132px);
    font-weight:900;
    line-height:0.92;
    letter-spacing:-2px;
    text-transform:uppercase;
  }
  h1 .outline{
    -webkit-text-stroke:3px var(--black);
    color:transparent;
  }
  .hero-sub{
    margin-top:36px;
    max-width:460px;
    font-size:16px;line-height:1.8;
    color:#333;
  }
  .cta{
    margin-top:48px;
    display:flex;gap:20px;flex-wrap:wrap;
  }
  .btn{
    display:inline-block;
    padding:18px 40px;
    font-size:14px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
    border:3px solid var(--black);
    transition:all .2s ease;
  }
  .btn.solid{background:var(--black);color:var(--white);}
  .btn.solid:hover{background:var(--white);color:var(--black);}
  .btn.ghost{background:transparent;color:var(--black);}
  .btn.ghost:hover{background:var(--black);color:var(--white);}

  /* 右侧几何装饰 */
  .hero-right{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    min-height:420px;
  }
  .circle-big{
    width:300px;height:300px;border-radius:50%;
    border:6px solid var(--black);
    position:relative;
  }
  .circle-big::after{
    content:"";position:absolute;inset:60px;border-radius:50%;background:var(--black);
  }
  .square-float{
    position:absolute;top:12%;right:8%;
    width:90px;height:90px;background:var(--black);
    transform:rotate(15deg);
  }
  .triangle-float{
    position:absolute;bottom:10%;left:6%;
    width:0;height:0;
    border-left:50px solid transparent;border-right:50px solid transparent;
    border-bottom:88px solid var(--black);
  }
  .bar{
    position:absolute;width:12px;height:220px;background:var(--black);
    transform:rotate(45deg);
    top:16%;left:26%;
    opacity:.85;
  }

  /* 底部横条信息 */
  footer{
    border-top:3px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    padding:24px 48px;
    font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  }
  .marquee{
    display:flex;gap:32px;overflow:hidden;
  }

  @media(max-width:820px){
    .hero{grid-template-columns:1fr;padding:0 24px;}
    .hero-right{min-height:320px;margin-top:-40px;}
    header,footer{padding:20px 24px;}
    nav{gap:18px;}
  }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <span class="square"></span>
      <span class="circle"></span>
      <span class="triangle"></span>
      Bauhaus
    </div>
    <nav>
      <a href="homepage.html">首页</a>
      <a href="login.html">登录</a>
      <a href="register.html">注册</a>
    </nav>
  </header>

  <main class="hero">
    <section class="hero-left">
      <div class="hero-tag">Form · Function · Design</div>
      <h1>Less<br>But<br><span class="outline">Better</span></h1>
      <p class="hero-sub">
        包豪斯主义追求形式服从功能、理性与极简。黑与白、几何与秩序，构成纯粹而有力的视觉语言。
      </p>
      <div class="cta">
        <a class="btn solid" href="register.html">立即注册</a>
        <a class="btn ghost" href="login.html">已有账户登录</a>
      </div>
    </section>

    <section class="hero-right">
      <div class="circle-big"></div>
      <div class="square-float"></div>
      <div class="triangle-float"></div>
      <div class="bar"></div>
    </section>
  </main>

  <footer>
    <span>© 2026 Bauhaus Studio</span>
    <div class="marquee">
      <span>格网</span><span>几何</span><span>理性</span><span>秩序</span>
    </div>
  </footer>
</body>
</html>
