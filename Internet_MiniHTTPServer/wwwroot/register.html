<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAUHAUS · 注册</title>
<style>
  :root{
    --black:#0a0a0a;
    --white:#f4f4f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--white);
    color:var(--black);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:28px 48px;border-bottom:3px solid var(--black);
  }
  .logo{font-size:24px;font-weight:900;letter-spacing:2px;text-transform:uppercase;}
  nav{display:flex;gap:36px;}
  nav a{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding-bottom:4px;border-bottom:2px solid transparent;}
  nav a.active,nav a:hover{border-bottom-color:var(--black);}

  .wrap{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:stretch;
  }

  /* 左侧装饰 */
  .aside{
    background:var(--black);
    color:var(--white);
    display:flex;flex-direction:column;justify-content:center;
    padding:64px;
    position:relative;
    overflow:hidden;
  }
  .aside h2{
    font-size:clamp(40px,6vw,88px);
    font-weight:900;line-height:1;letter-spacing:-1px;text-transform:uppercase;
    position:relative;z-index:2;
  }
  .aside p{
    margin-top:28px;font-size:15px;line-height:1.8;color:#cfcfcf;position:relative;z-index:2;max-width:380px;
  }
  .geo{position:absolute;pointer-events:none;}
  .geo.c1{width:180px;height:180px;border-radius:50%;border:4px solid var(--white);top:-40px;right:-40px;}
  .geo.c2{width:120px;height:120px;background:var(--white);bottom:8%;right:12%;transform:rotate(25deg);opacity:.9;}
  .geo.c3{width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:100px solid var(--white);bottom:-20px;left:10%;}

  /* 右侧表单 */
  .form-side{
    display:flex;align-items:center;justify-content:center;
    padding:64px 40px;
  }
  .form-box{width:100%;max-width:420px;}
  .form-box h1{
    font-size:38px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
  }
  .form-box .hint{font-size:14px;color:#555;margin-bottom:40px;}
  .field{margin-bottom:26px;}
  .field label{
    display:block;font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;
  }
  .field input{
    width:100%;padding:16px 0;font-size:16px;
    background:transparent;border:none;border-bottom:3px solid var(--black);
    outline:none;color:var(--black);
  }
  .field input:focus{border-bottom-color:var(--black);background:rgba(0,0,0,.03);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .btn{
    width:100%;margin-top:16px;padding:18px;cursor:pointer;
    background:var(--black);color:var(--white);
    font-size:14px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
    border:3px solid var(--black);transition:all .2s ease;
  }
  .btn:hover{background:var(--white);color:var(--black);}
  .login-link{margin-top:28px;text-align:center;font-size:14px;color:#555;}
  .login-link a{font-weight:800;border-bottom:2px solid var(--black);}

  footer{
    border-top:3px solid var(--black);
    display:flex;justify-content:space-between;padding:24px 48px;
    font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  }

  @media(max-width:820px){
    .wrap{grid-template-columns:1fr;}
    .aside{display:none;}
    header,footer{padding:20px 24px;}
  }
</style>
</head>
<body>
  <header>
    <div class="logo">Bauhaus</div>
    <nav>
      <a href="homepage.html">首页</a>
      <a href="login.html">登录</a>
      <a href="register.html" class="active">注册</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="aside">
      <div class="geo c1"></div>
      <div class="geo c2"></div>
      <div class="geo c3"></div>
      <h2>Join<br>the<br>Grid</h2>
      <p>加入我们，以理性与秩序构建你的数字空间。注册即认同——形式服从功能。</p>
    </section>

    <section class="form-side">
      <form class="form-box" onsubmit="alert('注册成功（演示）');return false;">
        <h1>注册</h1>
        <p class="hint">创建一个新账户，开始你的包豪斯之旅。</p>

        <div class="row">
          <div class="field">
            <label for="last">姓氏</label>
            <input id="last" type="text" placeholder="张" required>
          </div>
          <div class="field">
            <label for="first">名字</label>
            <input id="first" type="text" placeholder="三" required>
          </div>
        </div>

        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="username">用户名</label>
          <input id="username" type="text" placeholder="bauhaus_user" required>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>

        <button class="btn" type="submit">创建账户</button>

        <p class="login-link">已有账户？<a href="login.html">去登录</a></p>
      </form>
    </section>
  </main>

  <footer>
    <span>© 2026 Bauhaus Studio</span>
    <span>Register</span>
  </footer>
</body>
</html>
