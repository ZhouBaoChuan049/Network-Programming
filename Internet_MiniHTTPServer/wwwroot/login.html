<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAUHAUS · 登录</title>
<style>
  :root{
    --black:#0a0a0a;
    --white:#f4f4f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--white);
    color:var(--black);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:28px 48px;border-bottom:3px solid var(--black);
  }
  .logo{font-size:24px;font-weight:900;letter-spacing:2px;text-transform:uppercase;}
  nav{display:flex;gap:36px;}
  nav a{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding-bottom:4px;border-bottom:2px solid transparent;}
  nav a.active,nav a:hover{border-bottom-color:var(--black);}

  .wrap{
    flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;
  }

  .aside{
    background:var(--white);
    border-right:3px solid var(--black);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:64px;position:relative;overflow:hidden;
  }
  .target{
    width:220px;height:220px;border-radius:50%;
    border:6px solid var(--black);
    display:flex;align-items:center;justify-content:center;
  }
  .target .inner{
    width:110px;height:110px;border-radius:50%;background:var(--black);
  }
  .diag{
    position:absolute;width:14px;height:280px;background:var(--black);
    transform:rotate(-35deg);top:-30px;right:15%;
  }
  .sq{position:absolute;width:70px;height:70px;background:var(--black);bottom:12%;left:16%;transform:rotate(45deg);}

  .form-side{display:flex;align-items:center;justify-content:center;padding:64px 40px;}
  .form-box{width:100%;max-width:400px;}
  .form-box h1{font-size:38px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .form-box .hint{font-size:14px;color:#555;margin-bottom:40px;}
  .field{margin-bottom:28px;}
  .field label{display:block;font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
  .field input{
    width:100%;padding:16px 0;font-size:16px;
    background:transparent;border:none;border-bottom:3px solid var(--black);outline:none;color:var(--black);
  }
  .field input:focus{background:rgba(0,0,0,.03);}
  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;font-size:13px;}
  .row-between a{font-weight:700;border-bottom:1px solid var(--black);}
  .btn{
    width:100%;padding:18px;cursor:pointer;
    background:var(--black);color:var(--white);
    font-size:14px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
    border:3px solid var(--black);transition:all .2s ease;
  }
  .btn:hover{background:var(--white);color:var(--black);}
  .register-link{margin-top:28px;text-align:center;font-size:14px;color:#555;}
  .register-link a{font-weight:800;border-bottom:2px solid var(--black);}

  footer{
    border-top:3px solid var(--black);
    display:flex;justify-content:space-between;padding:24px 48px;
    font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  }

  @media(max-width:820px){
    .wrap{grid-template-columns:1fr;}
    .aside{display:none;}
    header,footer{padding:20px 24px;}
  }
</style>
</head>
<body>
  <header>
    <div class="logo">Bauhaus</div>
    <nav>
      <a href="homepage.html">首页</a>
      <a href="login.html" class="active">登录</a>
      <a href="register.html">注册</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="aside">
      <div class="target"><div class="inner"></div></div>
      <div class="diag"></div>
      <div class="sq"></div>
    </section>

    <section class="form-side">
      <form class="form-box" onsubmit="alert('登录成功（演示）');return false;">
        <h1>登录</h1>
        <p class="hint">欢迎回来，请验证你的身份。</p>

        <div class="field">
          <label for="username">用户名 / 邮箱</label>
          <input id="username" type="text" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>

        <div class="row-between">
          <label><input type="checkbox" style="accent-color:#0a0a0a;"> 记住我</label>
          <a href="404.html">忘记密码？</a>
        </div>

        <button class="btn" type="submit">登录</button>

        <p class="register-link">还没有账户？<a href="register.html">立即注册</a></p>
      </form>
    </section>
  </main>

  <footer>
    <span>© 2026 Bauhaus Studio</span>
    <span>Login</span>
  </footer>
</body>
</html>
