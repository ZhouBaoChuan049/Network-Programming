<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAUHAUS · 404</title>
<style>
  :root{
    --black:#0a0a0a;
    --white:#f4f4f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--black);
    color:var(--white);
    min-height:100vh;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  a{color:inherit;text-decoration:none;}

  main{
    flex:1;display:flex;align-items:center;justify-content:center;position:relative;
  }

  /* 巨型数字 */
  .code{
    font-size:clamp(160px,32vw,420px);
    font-weight:900;line-height:0.8;letter-spacing:-12px;
    display:flex;position:relative;z-index:2;
  }
  .code .o{
    width:clamp(90px,18vw,240px);
    height:clamp(90px,18vw,240px);
    border-radius:50%;
    border:clamp(8px,1.2vw,18px) solid var(--white);
    margin:0 clamp(8px,1.5vw,20px);
    align-self:center;
  }
  .code .o:first-of-type{background:var(--white);}

  /* 装饰几何 */
  .geo{position:absolute;pointer-events:none;}
  .g-square{width:70px;height:70px;background:var(--white);top:18%;left:14%;transform:rotate(15deg);}
  .g-tri{width:0;height:0;border-left:45px solid transparent;border-right:45px solid transparent;border-bottom:78px solid var(--white);top:22%;right:16%;}
  .g-bar{width:10px;height:200px;background:var(--white);bottom:12%;left:22%;transform:rotate(-40deg);}
  .g-circle{width:50px;height:50px;border-radius:50%;border:4px solid var(--white);bottom:20%;right:20%;}

  .content{
    position:relative;z-index:3;text-align:center;margin-top:-40px;
  }
  .content h1{
    font-size:clamp(24px,3vw,44px);font-weight:900;letter-spacing:2px;text-transform:uppercase;
  }
  .content p{
    margin-top:16px;font-size:15px;color:#c9c9c9;letter-spacing:1px;
  }
  .btn{
    display:inline-block;margin-top:40px;padding:18px 44px;
    background:var(--white);color:var(--black);
    font-size:14px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
    border:3px solid var(--white);transition:all .2s ease;
  }
  .btn:hover{background:transparent;color:var(--white);}

  footer{
    border-top:2px solid rgba(255,255,255,.25);
    display:flex;justify-content:space-between;padding:20px 48px;
    font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#aaa;
  }

  @media(max-width:820px){
    footer{padding:20px 24px;}
  }
</style>
</head>
<body>
  <main>
    <div class="geo g-square"></div>
    <div class="geo g-tri"></div>
    <div class="geo g-bar"></div>
    <div class="geo g-circle"></div>

    <div class="content">
      <div class="code">4<span class="o"></span><span class="o"></span></div>
      <h1>页面未找到</h1>
      <p>你访问的页面不存在，或已被移动。请返回首页继续探索。</p>
      <a class="btn" href="homepage.html">返回首页</a>
    </div>
  </main>

  <footer>
    <span>Bauhaus</span>
    <span>Error 404 · Not Found</span>
  </footer>
</body>
</html>
